name: Sync Upstream and Publish Release Asset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-and-publish-image.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: personal-cli-proxy-api-sync-v2
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: router-for-me/CLIProxyAPI
  PERSONAL_BRANCH: personal
  IMAGE_TAG_PREFIX: cpa-release
  IMAGE_ARCHIVE: cpa-arm64.tar
  COMPRESSED_ARCHIVE: cpa-arm64.tar.zst

jobs:
  sync-build-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout personal branch
        uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0

      - name: Set up automation Go
        id: setup_automation_go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Merge upstream and resolve official version
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          failure_report="${RUNNER_TEMP}/sync-failure.txt"
          : > "${failure_report}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

          official_version="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          release_ref="refs/remotes/upstream-release/${official_version}"
          git fetch --force --no-tags upstream \
            "refs/tags/${official_version}:${release_ref}"

          personal_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "${release_ref}^{commit}")"
          changed=false
          echo "official_version=${official_version}" >> "${GITHUB_OUTPUT}"
          echo "official_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

          if git merge-base --is-ancestor "${upstream_sha}" HEAD; then
            echo "Official release ${official_version} is already present."
          else
            merge_exit=0
            git merge --no-edit --no-commit "${upstream_sha}" || merge_exit=$?
            if [ "${merge_exit}" -gt 1 ]; then
              printf 'Git merge failed before conflict resolution (exit %s).\n' \
                "${merge_exit}" | tee "${failure_report}" >&2
              exit "${merge_exit}"
            fi

            # The Actions token cannot update workflow files on another branch. Keep the
            # personal branch workflow tree unchanged; automation lives on main.
            git rm -r -f --ignore-unmatch .github/workflows
            if git ls-tree -d --name-only "${personal_sha}" .github/workflows | grep -q '^.github/workflows$'; then
              git checkout "${personal_sha}" -- .github/workflows
            fi
            git add -A .github/workflows

            customization_paths=(
              internal/api/handlers/management/config_lists.go
              internal/config/config_normalization.go
              internal/config/config_types.go
              internal/config/vertex_compat.go
            )
            customization_conflicts=()
            while IFS= read -r conflict_path; do
              [ -n "${conflict_path}" ] || continue
              customization_path=false
              for candidate in "${customization_paths[@]}"; do
                if [ "${conflict_path}" = "${candidate}" ]; then
                  customization_path=true
                  break
                fi
              done
              if [ "${customization_path}" = 'true' ]; then
                if git ls-files -u -- "${conflict_path}" | awk '$3 == 3 { found=1 } END { exit !found }'; then
                  git checkout --theirs -- "${conflict_path}"
                  git add -- "${conflict_path}"
                else
                  git rm -f -- "${conflict_path}"
                fi
                customization_conflicts+=("${conflict_path}")
              fi
            done < <(git diff --name-only --diff-filter=U)

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "${unresolved}" ]; then
              {
                echo "Official release ${official_version} has semantic conflicts requiring review:"
                printf '%s\n' "${unresolved}"
              } | tee "${failure_report}" >&2
              exit 1
            fi

            customization_tool="${RUNNER_TEMP}/ensure-provider-display-name.go"
            git show "${GITHUB_SHA}:.github/scripts/ensure-provider-display-name.go" > "${customization_tool}"
            go run "${customization_tool}"
            git add -- "${customization_paths[@]}"

            if [ "${#customization_conflicts[@]}" -gt 0 ]; then
              printf 'Restored provider display-name behavior over official conflict resolutions:\n%s\n' \
                "$(printf '%s\n' "${customization_conflicts[@]}")"
            fi

            git commit -m "Merge official release ${official_version} into personal"
            changed=true
          fi

          source_sha="$(git rev-parse HEAD)"

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this release needs a build
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sync.outputs.official_version }}
        run: |
          set -euo pipefail
          should_build=false
          if [ "${{ steps.sync.outputs.changed }}" = 'true' ] || \
            [ "${{ github.event_name }}" = 'workflow_dispatch' ] || \
            [ "${{ github.event_name }}" = 'push' ]; then
            should_build=true
          elif release_json="$(gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets 2>/dev/null)"; then
            for asset in "${COMPRESSED_ARCHIVE}" "${COMPRESSED_ARCHIVE}.sha256"; do
              if ! jq -e --arg name "${asset}" '.assets[] | select(.name == $name)' <<<"${release_json}" >/dev/null; then
                should_build=true
              fi
            done
          else
            should_build=true
          fi
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        id: setup_go
        if: steps.release.outputs.should_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Probe quarantined upstream CPA test
        id: upstream_test_probe
        if: steps.release.outputs.should_build == 'true'
        continue-on-error: true
        run: go test ./internal/runtime/executor -run '^TestOpenAICompatExecutorToolResultContentByInputModalities$' -count=1

      - name: Test fork behavior contract
        id: fork_contract
        if: steps.release.outputs.should_build == 'true'
        run: |
          go test ./internal/config -run '^TestStaticProviderDisplayName' -count=1
          go test ./internal/api/handlers/management \
            -run '^TestPatchStaticProviderDisplayNameForEveryFamily$' -count=1

      - name: Test upstream CPA suite (advisory)
        id: upstream_suite
        if: steps.release.outputs.should_build == 'true'
        continue-on-error: true
        run: |
          test_args=()
          if [ "${{ steps.upstream_test_probe.outcome }}" = 'failure' ]; then
            echo '::warning title=Upstream CPA test quarantined::Skipping TestOpenAICompatExecutorToolResultContentByInputModalities while the upstream regression remains reproducible.'
            test_args=(-skip '^TestOpenAICompatExecutorToolResultContentByInputModalities$')
          fi
          go test ./... "${test_args[@]}" -timeout=5m

      - name: Report upstream test instability
        if: steps.release.outputs.should_build == 'true' && steps.upstream_suite.outcome == 'failure'
        run: |
          echo '::warning title=Upstream CPA suite is unstable::The upstream test suite failed, but the fork customization test passed. Build and smoke-test will continue.'

      - name: Set up QEMU
        if: steps.release.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.release.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Resolve build metadata
        id: metadata
        if: steps.release.outputs.should_build == 'true'
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build ARM64 Docker archive
        id: build_image
        if: steps.release.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          tags: ${{ env.IMAGE_TAG_PREFIX }}:${{ steps.sync.outputs.official_version }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_ARCHIVE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.sync.outputs.official_version }}
            org.opencontainers.image.revision=${{ steps.sync.outputs.source_sha }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
          build-args: |
            VERSION=${{ steps.sync.outputs.official_version }}
            COMMIT=${{ steps.sync.outputs.source_sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}

      - name: Compress and checksum archive
        id: compress_image
        if: steps.release.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          zstd -T0 -19 "/tmp/${IMAGE_ARCHIVE}" -o "/tmp/${COMPRESSED_ARCHIVE}"
          sha256sum "/tmp/${COMPRESSED_ARCHIVE}" > "/tmp/${COMPRESSED_ARCHIVE}.sha256"

      - name: Smoke-test the built CPA image
        id: smoke_test
        if: steps.release.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.official_version }}
        run: |
          set -Eeuo pipefail
          image="${IMAGE_TAG_PREFIX}:${VERSION}"
          container="cpa-ci-smoke-${GITHUB_RUN_ID}"
          port=18317
          docker rm -f "${container}" >/dev/null 2>&1 || true
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker load --input "/tmp/${IMAGE_ARCHIVE}"
          docker run --pull=never --detach --name "${container}" \
            --publish "127.0.0.1:${port}:8317" \
            --volume "${GITHUB_WORKSPACE}/config.example.yaml:/CLIProxyAPI/config.yaml:ro" \
            "${image}"

          last_code=""
          for attempt in $(seq 1 45); do
            if last_code="$(curl --silent --show-error --max-time 5 \
              --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${port}/healthz")" && [ "${last_code}" = '200' ]; then
              echo "CPA image smoke test passed on attempt ${attempt}."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "${container}" 2>/dev/null || true)" != 'true' ]; then
              echo "CPA smoke-test container exited (HTTP ${last_code:-000})." >&2
              docker logs "${container}" >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "CPA image smoke test timed out (last HTTP ${last_code:-000})." >&2
          docker logs "${container}" >&2 || true
          exit 1

      - name: Publish tested personal branch
        id: publish_branch
        if: steps.release.outputs.should_build == 'true' && steps.sync.outputs.changed == 'true'
        run: git push origin "HEAD:${PERSONAL_BRANCH}"

      - name: Create or update official-version GitHub Release
        id: publish_release
        if: steps.release.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sync.outputs.official_version }}
          OFFICIAL_SHA: ${{ steps.sync.outputs.official_sha }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          set -euo pipefail
          notes="ARM64 Docker archive built from the official ${VERSION} release (${OFFICIAL_SHA}) and the fork's tested personal branch (${SOURCE_SHA}). Upstream release: https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${VERSION}"

          retry() {
            local attempt=1
            local delay=5
            until "$@"; do
              if [ "${attempt}" -ge 5 ]; then
                return 1
              fi
              echo "GitHub API request failed; retrying in ${delay}s (attempt ${attempt}/5)." >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ensure_release() {
            if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --title "${VERSION}" --notes "${notes}"
            else
              gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${SOURCE_SHA}" --title "${VERSION}" --notes "${notes}"
            fi
          }

          retry ensure_release
          retry gh release upload "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "/tmp/${COMPRESSED_ARCHIVE}" "/tmp/${COMPRESSED_ARCHIVE}.sha256"

      - name: Notify DingTalk on failure
        id: failure_notice
        if: ${{ failure() }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OFFICIAL_VERSION: ${{ steps.sync.outputs.official_version }}
          AUTOMATION_SETUP_OUTCOME: ${{ steps.setup_automation_go.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          RELEASE_CHECK_OUTCOME: ${{ steps.release.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_go.outcome }}
          CONTRACT_OUTCOME: ${{ steps.fork_contract.outcome }}
          BUILD_OUTCOME: ${{ steps.build_image.outcome }}
          COMPRESS_OUTCOME: ${{ steps.compress_image.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke_test.outcome }}
          BRANCH_OUTCOME: ${{ steps.publish_branch.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set +e
          if [ -z "${DINGTALK_WEBHOOK}" ] || [ -z "${DINGTALK_SECRET}" ]; then
            echo 'DINGTALK_WEBHOOK or DINGTALK_SECRET is not configured.' >&2
            exit 0
          fi

          failed_stage='unknown'
          for item in \
            "automation-go:${AUTOMATION_SETUP_OUTCOME}" \
            "sync:${SYNC_OUTCOME}" \
            "release-check:${RELEASE_CHECK_OUTCOME}" \
            "go-setup:${SETUP_OUTCOME}" \
            "fork-contract:${CONTRACT_OUTCOME}" \
            "image-build:${BUILD_OUTCOME}" \
            "compression:${COMPRESS_OUTCOME}" \
            "smoke-test:${SMOKE_OUTCOME}" \
            "branch-publish:${BRANCH_OUTCOME}" \
            "release-publish:${RELEASE_OUTCOME}"; do
            if [ "${item#*:}" = 'failure' ]; then
              failed_stage="${item%%:*}"
              break
            fi
          done

          detail='No structured detail was recorded. Open the run link for the first red step.'
          if [ -s "${RUNNER_TEMP}/sync-failure.txt" ]; then
            detail="$(head -c 1500 "${RUNNER_TEMP}/sync-failure.txt")"
          fi
          signature="${OFFICIAL_VERSION:-unknown}|${failed_stage}|${detail}"
          fingerprint="$(printf '%s' "${signature}" | sha256sum | cut -c1-16)"
          marker_name="cpa-sync-failure-${fingerprint}"
          previous_conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-and-publish-image.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"' 2>/dev/null)"
          marker_exists="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${marker_name}\") | .id" 2>/dev/null | head -1)"
          if [ "${previous_conclusion}" = 'failure' ] && [ -n "${marker_exists}" ]; then
            echo "Repeated failure ${marker_name}; DingTalk notification suppressed."
            exit 0
          fi

          content="$(cat <<EOF
          【CPA 自动同步失败】
          仓库：${GITHUB_REPOSITORY}
          官方版本：${OFFICIAL_VERSION:-未解析}
          失败阶段：${failed_stage}
          详情：${detail}
          运行：${RUN_URL}
          处理建议：
          1. fork-contract 失败表示官方改动没有完整保留备注名行为，需要处理源码兼容。
          2. sync 阶段仅在未知业务文件冲突时停止；工作流冲突和已被测试覆盖的配置冲突会自动处理。
          3. build/smoke/release 阶段失败可直接打开运行链接重试；未经完整验证不会发布资产。
          本机不会接收失败运行产生的资产，当前运行版本保持不变。
          EOF
          )"
          timestamp="$(date +%s)000"
          sign="$(
            printf '%s\n%s' "${timestamp}" "${DINGTALK_SECRET}" |
              openssl dgst -sha256 -hmac "${DINGTALK_SECRET}" -binary |
              base64 | tr -d '\r\n' | jq -sRr @uri
          )"
          separator='?'
          case "${DINGTALK_WEBHOOK}" in *\?*) separator='&' ;; esac
          payload="$(jq -n --arg content "${content}" '{msgtype:"text",text:{content:$content}}')"
          response_file="${RUNNER_TEMP}/dingtalk-response-${GITHUB_RUN_ID}.json"
          if http_code="$(curl --fail --silent --show-error --location --http1.1 \
            --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-all-errors --retry-connrefused \
            --retry-delay 2 --retry-max-time 45 \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            -o "${response_file}" -w '%{http_code}' \
            "${DINGTALK_WEBHOOK}${separator}timestamp=${timestamp}&sign=${sign}")"; then
            curl_exit=0
          else
            curl_exit=$?
          fi
          if [ "${curl_exit}" -ne 0 ]; then
            echo "DingTalk notification request failed (curl=${curl_exit}, http=${http_code:-000})." >&2
            exit 0
          fi
          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]] || \
            ! jq -e '.errcode == 0' "${response_file}" >/dev/null 2>&1; then
            echo "DingTalk notification returned an unexpected response (http=${http_code:-000})." >&2
            exit 0
          fi
          echo 'DingTalk failure notification delivered.'
          printf '%s\n' "${signature}" > "${RUNNER_TEMP}/sync-failure-marker"
          echo "marker_name=${marker_name}" >> "${GITHUB_OUTPUT}"

      - name: Record failure fingerprint
        if: ${{ failure() && steps.failure_notice.outputs.marker_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.failure_notice.outputs.marker_name }}
          path: ${{ runner.temp }}/sync-failure-marker
          retention-days: 30
          if-no-files-found: ignore
