name: Sync Upstream and Publish Image

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: personal-cli-proxy-api-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: router-for-me/CLIProxyAPI
  UPSTREAM_BRANCH: main
  PERSONAL_BRANCH: personal
  IMAGE_NAME: ghcr.io/notchen/cli-proxy-api

jobs:
  sync-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal branch
        uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0

      - name: Merge upstream stable branch
        id: sync
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --tags upstream "${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          if git merge-base --is-ancestor "${upstream_sha}" HEAD; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            echo "personal already contains upstream ${upstream_sha}."
          else
            git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve official version
        id: version
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          official_version="$(git describe --tags --abbrev=0 "upstream/${UPSTREAM_BRANCH}")"
          echo "value=${official_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CPA as release gate
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: go build -o /tmp/CLIProxyAPI ./cmd/server

      - name: Set up Docker Buildx
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish CPA image
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}

      - name: Publish the successfully tested branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin "HEAD:${PERSONAL_BRANCH}"

      - name: Notify DingTalk on failure
        if: ${{ failure() }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "${DINGTALK_WEBHOOK}" ]; then
            echo 'DINGTALK_WEBHOOK is not configured.' >&2
            exit 0
          fi
          content="CPA sync/build/publish failed. Repository: ${GITHUB_REPOSITORY}; run: ${RUN_URL}"
          payload="$(jq -n --arg content "${content}" '{msgtype:"text",text:{content:$content}}')"
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "${DINGTALK_WEBHOOK}" >/dev/null || true
